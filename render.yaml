services:
  - type: web
    name: object-manager-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # This will prompt you to enter the URI in the Render UI
      - key: CLOUDINARY_CLOUD_NAME
        sync: false 
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://your-app.vercel.app # Update this after Vercel deployment
